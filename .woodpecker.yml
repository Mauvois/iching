steps:
  run_tests:
    image: python:3.12-slim
    commands:
      - pip install --no-cache-dir -r requirements.frontend.txt
      - pip install --no-cache-dir -r requirements.backend.txt
      - pip install --no-cache-dir -r services/interpreter/requirements.txt
      - python -m py_compile frontend/front.py backend/main.py services/interpreter/app.py
    when:
      event:
        - push
        - pull_request

  deploy_prod:
    image: docker:27-cli
    depends_on:
      - run_tests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENAI_API_KEY:
        from_secret: OPENAI_API_KEY
      OPENAI_API_KEY_FALLBACK:
        from_secret: openai_api_key
      OPENAI_MODEL:
        from_secret: OPENAI_MODEL
      OPENAI_MODEL_FALLBACK:
        from_secret: openai_model
    commands:
      - apk add --no-cache docker-cli-compose
      - export OPENAI_API_KEY="${OPENAI_API_KEY:-$OPENAI_API_KEY_FALLBACK}"
      - export OPENAI_MODEL="${OPENAI_MODEL:-$OPENAI_MODEL_FALLBACK}"
      - export OPENAI_MODEL="${OPENAI_MODEL:-gpt-4o-mini}"
      - export PORT_FRONT=18050
      - test -n "$OPENAI_API_KEY" || (echo "missing required secret OPENAI_API_KEY" && exit 1)
      - trap 'rm -f .env.ci' EXIT
      - printf 'OPENAI_API_KEY=%s\nOPENAI_MODEL=%s\nPORT_FRONT=%s\n' "$OPENAI_API_KEY" "$OPENAI_MODEL" "$PORT_FRONT" > .env.ci
      - docker compose --env-file .env.ci up -d --build
      - docker compose --env-file .env.ci ps
      - docker compose --env-file .env.ci exec -T iching_back python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8080/", timeout=5); print("backend ok")'
      - docker compose --env-file .env.ci exec -T iching_interpreter python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8080/health", timeout=5); print("interpreter ok")'
      - docker compose --env-file .env.ci exec -T iching_front python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8050/", timeout=5); print("frontend ok")'
    when:
      event: push
      branch:
        - main
